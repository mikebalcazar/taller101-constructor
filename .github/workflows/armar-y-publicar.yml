# Arma el instalador de un programa de la suite101 y lo publica en `descargas`.
#
# ⚠️  ESTE ARCHIVO VA EN `.github/workflows/armar-y-publicar.yml`
#     El conector del chat no puede escribir en esa carpeta (GitHub se lo
#     niega: «refusing to allow a GitHub App to create or update workflow
#     without workflows permission»). Mike lo mueve desde la web: abrir este
#     archivo, tocar el lápiz, y en la cajita del nombre escribir
#         .github/workflows/armar-y-publicar.yml
#     (la ruta completa, empezando por el punto), borrar este encabezado hasta
#     la raya, y Commit changes.
#
# POR QUÉ ESTE REPO EXISTE  ·  18-sep-2026
#
#   Los repos de los programas (draw101, nest101, shape101) son **privados**,
#   porque se venden. En un repo privado los minutos de Actions se cobran, y la
#   bolsa del mes se acabó: desde el 16-sep los armados morían a los diez
#   segundos con «an Actions budget is preventing further use», sin llegar a
#   arrancar. En un repo **público** Actions es gratis e ilimitado.
#
#   Los minutos se cobran donde vive el flujo, no donde vive el código. Así que
#   el flujo vive aquí, en público, y el código sigue privado: se clona con un
#   token, se arma y se borra. Lo único público es este guion; los instaladores
#   ya eran públicos (están en `descargas`).
#
# QUÉ NO SE HACE AQUÍ, A PROPÓSITO
#
#   El registro de un repo público lo puede leer cualquiera. Por eso este flujo
#   **no lista archivos, no imprime rutas del código y no vuelca contenidos**:
#   sólo dice en qué paso va, el tamaño y la huella de lo armado. Y no hay
#   disparo por `pull_request`: sólo corre a mano o por un pedido escrito en
#   `pedidos/`. GitHub tampoco entrega secretos a un fork, pero más vale
#   cerrarlo con intención que confiar en que nadie lo intente.
#
# QUÉ NECESITA (secretos del repositorio, los pone Mike una vez)
#
#   TOKEN_FUENTE     token fine-grained con acceso a los repos de los programas
#                    (draw101, nest101, shape101), permiso **Contents: Read**.
#                    Sólo lee: este repo nunca escribe en la fuente.
#   TOKEN_DESCARGAS  token fine-grained con acceso SÓLO a `descargas`, permiso
#                    **Contents: Read and write**. Es el mismo que ya existe en
#                    draw101; hay que copiarlo aquí.
#
# CÓMO SE DISPARA
#
#   A mano (Actions → «Armar y publicar» → Run workflow), eligiendo programa,
#   versión y rama. El chat de cada programa avisa aquí qué rama publicar
#   escribiendo `pedidos/<programa>.txt`, y ese cambio también dispara.
# ---------------------------------------------------------------------------

name: Armar y publicar

on:
  workflow_dispatch:
    inputs:
      programa:
        description: 'Qué programa armar'
        type: choice
        options: [draw101, nest101, shape101]
        default: draw101
      rama:
        description: 'Rama del repo del programa (p. ej. claude/publicar-0.20.18)'
        type: string
        required: true
      con_pruebas:
        description: 'Correr las pruebas aquí (normalmente no: ya se corren en el chat)'
        type: boolean
        default: false
  push:
    paths: ['pedidos/*.txt']

permissions:
  contents: read

concurrency:
  group: armar-${{ github.event_name == 'workflow_dispatch' && inputs.programa || 'pedido' }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  WINEDEBUG: '-all'
  WINEDLLOVERRIDES: 'mscoree,mshtml='
  GUARDAR_VERSIONES: '3'

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Qué hay que armar
        id: pedido
        env:
          TOKEN_FUENTE: ${{ secrets.TOKEN_FUENTE }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROGRAMA="${{ inputs.programa }}"
            RAMA="${{ inputs.rama }}"
          else
            ARCHIVO=$(git diff --name-only HEAD~1 HEAD -- 'pedidos/*.txt' | head -1 || true)
            [ -n "$ARCHIVO" ] || { echo "No cambió ningún pedido: nada que armar."; exit 0; }
            PROGRAMA=$(basename "$ARCHIVO" .txt)
            RAMA=$(grep -m1 -v '^\s*#' "$ARCHIVO" | tr -d '\r' | xargs)
          fi
          case "$PROGRAMA" in
            draw101|nest101|shape101) ;;
            *) echo "::error::Programa desconocido: $PROGRAMA"; exit 1;;
          esac
          [ -n "${TOKEN_FUENTE:-}" ] || { echo "::error::Falta el secreto TOKEN_FUENTE."; exit 1; }
          echo "programa=$PROGRAMA" >> "$GITHUB_OUTPUT"
          echo "rama=$RAMA" >> "$GITHUB_OUTPUT"
          echo "Armando $PROGRAMA desde $RAMA"

      - name: Traer el código (privado; se borra al terminar)
        env:
          TOKEN_FUENTE: ${{ secrets.TOKEN_FUENTE }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "${{ steps.pedido.outputs.rama }}" \
            "https://x-access-token:${TOKEN_FUENTE}@github.com/mikebalcazar/${{ steps.pedido.outputs.programa }}" fuente 2> /dev/null \
            || { echo "::error::No se pudo traer la rama pedida (¿existe? ¿el token la alcanza?)"; exit 1; }
          echo "código traído"

      - name: Aplicar parches pendientes (claude/APLICAR.txt)
        working-directory: fuente
        run: |
          set -euo pipefail
          if [ -f claude/APLICAR.txt ]; then
            faltan=0
            while read -r p; do
              p="${p%$'\r'}"
              [ -z "$p" ] && continue
              [ -f "claude/$p" ] || { echo "::error::el parche $p está en la lista y no en la rama"; faltan=1; }
            done < claude/APLICAR.txt
            [ $faltan = 0 ] || exit 1
            while read -r p; do
              p="${p%$'\r'}"
              [ -z "$p" ] && continue
              sed -i 's/\r$//' "claude/$p"
              git apply --check "claude/$p" && git apply "claude/$p"
            done < claude/APLICAR.txt
            echo "parches aplicados"
          else
            echo "sin parches pendientes"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Versión
        id: version
        working-directory: fuente
        run: |
          set -euo pipefail
          VER=$(python -c "import core.version as v; print(v.VERSION)")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          RAMA="${{ steps.pedido.outputs.rama }}"
          case "$RAMA" in
            */publicar-*)
              PED="${RAMA##*/publicar-}"
              [ "$PED" = "$VER" ] || { echo "::error::la rama pide $PED y el código dice $VER"; exit 1; };;
          esac
          grep -q "\"version\": \"$VER\"" package.json || { echo "::error::package.json no dice $VER"; exit 1; }
          case "$VER" in X.*) echo "::error::la línea X no se publica"; exit 1;; esac
          echo "versión $VER"

      - name: wine y 7z
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends p7zip-full wine wine32:i386 > /dev/null
          wine --version

      - name: Python empotrado (del último instalador publicado)
        working-directory: fuente
        run: |
          set -euo pipefail
          P=${{ steps.pedido.outputs.programa }}
          ARCH=$(curl -s "https://raw.githubusercontent.com/mikebalcazar/descargas/main/$P.json" \
                 | python -c "import json,sys;print(json.load(sys.stdin)['$P']['windows']['archivo'])")
          curl -sSL -o anterior.exe "https://github.com/mikebalcazar/descargas/releases/download/$P-ultima/$ARCH"
          7z x -y -oanterior anterior.exe "resources/python/*" > /dev/null
          mkdir -p runtime && mv anterior/resources/python runtime/python
          test -f runtime/python/python.exe
          rm -rf anterior anterior.exe
          echo "python empotrado ok"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dependencias de Electron
        working-directory: fuente
        run: npm ci --no-audit --no-fund > /dev/null

      - name: Pruebas
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.con_pruebas }}
        working-directory: fuente
        run: |
          set -euo pipefail
          pip install -q ezdxf fastapi uvicorn numpy pillow reportlab pymupdf pypdfium2 playwright
          python -m playwright install chromium
          python verificar.py

      - name: Armar el instalador
        working-directory: fuente
        run: npx electron-builder --win nsis > /dev/null

      - name: Preparar la carga
        id: carga
        working-directory: fuente
        run: |
          set -euo pipefail
          P=${{ steps.pedido.outputs.programa }}
          VER=${{ steps.version.outputs.version }}
          python build/cargar.py "dist/$P-$VER-setup.exe" salida
          SHA=$(python -c "import json;print(json.load(open('salida/carga/meta.json'))['sha256'])")
          B=$(python -c "import json;print(json.load(open('salida/carga/meta.json'))['bytes'])")
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "bytes=$B" >> "$GITHUB_OUTPUT"
          {
            echo "## $P $VER armada"
            echo
            echo "- \`$P-$VER-setup.exe\` · $B bytes · sha256 \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cargar a descargas
        id: cargar
        env:
          TOKEN: ${{ secrets.TOKEN_DESCARGAS }}
        run: |
          set -euo pipefail
          P=${{ steps.pedido.outputs.programa }}
          VER=${{ steps.version.outputs.version }}
          [ -n "${TOKEN:-}" ] || { echo "::error::Falta el secreto TOKEN_DESCARGAS."; exit 1; }
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/mikebalcazar/descargas" descargas 2> /dev/null
          cd descargas
          git config user.name "suite101 (constructor)"
          git config user.email "mike@forespot.com"
          git checkout -q -b "claude/carga-$P-$VER"
          rm -rf carga && cp -r ../fuente/salida/carga carga
          git add carga
          git commit -qm "carga: $P $VER (armada por el constructor)"
          git push -q origin "claude/carga-$P-$VER" 2> /dev/null
          echo "carga empujada; publicar-instalador.yml arranca solo en descargas"

      - name: Esperar la release y dejar el manifiesto
        env:
          TOKEN: ${{ secrets.TOKEN_DESCARGAS }}
        run: |
          set -euo pipefail
          P=${{ steps.pedido.outputs.programa }}
          VER=${{ steps.version.outputs.version }}
          SHA=${{ steps.carga.outputs.sha256 }}
          B=${{ steps.carga.outputs.bytes }}
          URL="https://github.com/mikebalcazar/descargas/releases/download/$P-$VER/$P-$VER-setup.exe"
          ok=0
          for i in $(seq 1 40); do
            code=$(curl -s -L --max-time 300 -o bajado.exe -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then
              sha=$(sha256sum bajado.exe | cut -d' ' -f1); b=$(stat -c '%s' bajado.exe)
              if [ "$sha" = "$SHA" ] && [ "$b" = "$B" ]; then ok=1; break; fi
            fi
            rm -f bajado.exe; sleep 30
          done
          [ $ok = 1 ] || { echo "::error::la release $P-$VER no apareció con la huella esperada: no se toca el manifiesto"; exit 1; }
          echo "release $P-$VER publicada y comprobada"

          cd descargas
          git checkout -q main && git pull -q
          cp "../fuente/salida/$P.json" "$P.json"
          PROGRAMA=$P python - <<'EOF'
          import os, re, pathlib
          P = os.environ["PROGRAMA"]
          renglon = pathlib.Path("../fuente/salida/readme-renglon.md").read_text(encoding="utf-8").strip()
          p = pathlib.Path("README.md"); s = p.read_text(encoding="utf-8")
          nuevo, n = re.subn(rf"^\| \*\*{P}\*\* \|.*$", renglon, s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit(f"no encontré el renglón de {P} en README.md")
          p.write_text(nuevo, encoding="utf-8")
          EOF
          git add "$P.json" README.md
          git commit -qm "$P $VER: manifiesto y README (constructor)"
          git push -q origin main 2> /dev/null
          echo "- Release \`$P-$VER\` publicada · manifiesto y README al día." >> "$GITHUB_STEP_SUMMARY"

      - name: Podar releases viejas
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.TOKEN_DESCARGAS }}
          PROGRAMA: ${{ steps.pedido.outputs.programa }}
          GUARDAR: ${{ env.GUARDAR_VERSIONES }}
        run: |
          set -euo pipefail
          python - <<'EOF'
          import json, os, re, urllib.request
          TOKEN, P = os.environ["TOKEN"], os.environ["PROGRAMA"]
          GUARDAR = int(os.environ.get("GUARDAR", "3"))
          REPO = "mikebalcazar/descargas"

          def api(ruta, metodo="GET"):
              pedido = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}{ruta}", method=metodo,
                  headers={"Authorization": f"Bearer {TOKEN}",
                           "Accept": "application/vnd.github+json",
                           "User-Agent": "suite101-constructor"})
              with urllib.request.urlopen(pedido, timeout=60) as r:
                  return json.loads(r.read() or b"null") if r.status != 204 else None

          releases = api("/releases?per_page=100") or []
          mias = [r for r in releases
                  if r["tag_name"].startswith(f"{P}-") and r["tag_name"] != f"{P}-ultima"]
          mias.sort(key=lambda r: tuple(int(x) for x in re.findall(r"\d+", r["tag_name"])),
                    reverse=True)
          sobran = mias[GUARDAR:]
          for r in sobran:
              api(f"/releases/{r['id']}", "DELETE")
              try:
                  api(f"/git/refs/tags/{r['tag_name']}", "DELETE")
              except Exception:
                  pass
              print("borrada", r["tag_name"])
          if sobran:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write(f"- Podadas {len(sobran)} releases viejas de {P}.\n")
          EOF

      - name: Borrar el código traído
        if: always()
        run: rm -rf fuente
